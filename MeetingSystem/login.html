<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng nhập - Quản lý sinh hoạt tổ chuyên môn</title>
    
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
    
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/responsive.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="login-body">
    <div class="login-container">
        <div class="login-card">
            <div class="login-brand">
                <div class="login-brand-icon">🏫</div>
                <h1>Quản lý sinh hoạt</h1>
                <p>Tổ chuyên môn</p>
            </div>
            
            <form id="loginForm" class="login-form">
                <div class="form-group">
                    <label for="emailInput">
                        <i class="fas fa-envelope"></i>
                        Email
                    </label>
                    <input type="email" id="emailInput" placeholder="nhap@email.com" required autocomplete="email">
                </div>
                
                <div class="form-group">
                    <label for="passwordInput">
                        <i class="fas fa-lock"></i>
                        Mật khẩu
                    </label>
                    <div class="password-wrapper">
                        <input type="password" id="passwordInput" placeholder="••••••••" required autocomplete="current-password">
                        <button type="button" id="togglePassword" class="btn-toggle-password">
                            <i class="fas fa-eye"></i>
                        </button>
                    </div>
                </div>
                
                <div id="loginError" class="login-error" style="display:none;"></div>
                
                <button type="submit" id="loginBtn" class="btn-login">
                    <i class="fas fa-sign-in-alt"></i>
                    Đăng nhập
                </button>
                
                <div class="login-divider">
                    <span>Hoặc</span>
                </div>
                
                <button type="button" id="googleLoginBtn" class="btn-google-login">
                    <i class="fab fa-google"></i>
                    Đăng nhập với Google
                </button>
                
                <div class="login-footer">
                    <p>Hệ thống quản lý sinh hoạt tổ chuyên môn</p>
                    <p class="login-version">v1.0 MVP</p>
                </div>
            </form>
        </div>
    </div>
    
    <!-- Toast -->
    <div id="toastContainer" class="toast-container"></div>
    
    <script src="js/firebase-config.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/ui.js"></script>
    <script>
        // Login page specific logic
        document.addEventListener('DOMContentLoaded', function() {
            // Check if already logged in
            firebase.auth().onAuthStateChanged(function(user) {
                if (user) {
                    window.location.href = 'index.html';
                }
            });
            
            // Toggle password visibility
            document.getElementById('togglePassword').addEventListener('click', function() {
                const input = document.getElementById('passwordInput');
                const icon = this.querySelector('i');
                if (input.type === 'password') {
                    input.type = 'text';
                    icon.classList.remove('fa-eye');
                    icon.classList.add('fa-eye-slash');
                } else {
                    input.type = 'password';
                    icon.classList.remove('fa-eye-slash');
                    icon.classList.add('fa-eye');
                }
            });
            
            // Login form submit
            document.getElementById('loginForm').addEventListener('submit', function(e) {
                e.preventDefault();
                const email = document.getElementById('emailInput').value.trim();
                const password = document.getElementById('passwordInput').value;
                const errorEl = document.getElementById('loginError');
                const loginBtn = document.getElementById('loginBtn');
                
                if (!email || !password) {
                    errorEl.textContent = 'Vui lòng nhập đầy đủ email và mật khẩu.';
                    errorEl.style.display = 'block';
                    return;
                }
                
                errorEl.style.display = 'none';
                loginBtn.disabled = true;
                loginBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Đang đăng nhập...';
                
                firebase.auth().signInWithEmailAndPassword(email, password)
                    .then(function(userCredential) {
                        // Redirect handled by auth state change
                    })
                    .catch(function(error) {
                        loginBtn.disabled = false;
                        loginBtn.innerHTML = '<i class="fas fa-sign-in-alt"></i> Đăng nhập';
                        
                        let message = 'Đăng nhập thất bại. Vui lòng kiểm tra lại.';
                        if (error.code === 'auth/user-not-found') {
                            message = 'Không tìm thấy tài khoản với email này.';
                        } else if (error.code === 'auth/wrong-password') {
                            message = 'Mật khẩu không đúng. Vui lòng thử lại.';
                        } else if (error.code === 'auth/invalid-email') {
                            message = 'Email không hợp lệ.';
                        } else if (error.code === 'auth/too-many-requests') {
                            message = 'Quá nhiều yêu cầu. Vui lòng thử lại sau.';
                        }
                        errorEl.textContent = message;
                        errorEl.style.display = 'block';
                    });
            });
            
            // Google login
            document.getElementById('googleLoginBtn').addEventListener('click', function() {
                const provider = new firebase.auth.GoogleAuthProvider();
                const btn = this;
                btn.disabled = true;
                btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Đang kết nối...';
                
                firebase.auth().signInWithPopup(provider)
                    .then(function(result) {
                        // Redirect handled by auth state change
                    })
                    .catch(function(error) {
                        btn.disabled = false;
                        btn.innerHTML = '<i class="fab fa-google"></i> Đăng nhập với Google';
                        showToast('Đăng nhập Google thất bại: ' + error.message, 'error');
                    });
            });
        });
    </script>
</body>
</html>
